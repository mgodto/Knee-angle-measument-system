name: Build Measurement GUI Windows x64

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements-app.txt

      - name: Build, smoke test, and audit package
        shell: cmd
        run: build_measurement_windows.bat

      - name: Upload final Windows release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KneeXrayMeasurement-Windows-x64-v0.2.4-20260720
          path: dist/KneeXrayMeasurement-Windows-x64-v0.2.4-20260720.zip
          if-no-files-found: error
          retention-days: 7
