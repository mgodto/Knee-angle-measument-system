name: Build Measurement GUI Windows x64

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements-app.txt

      - name: Generate and compile English Windows entrypoint
        shell: cmd
        run: >-
          python generate_windows_english_entrypoint.py
          --source knee_measurement_app.py
          --output knee_measurement_app_windows.py

      - name: Build, smoke test, and audit package
        shell: cmd
        run: build_measurement_windows.bat

      - name: Upload final Windows release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KneeXrayMeasurement-ResearchCandidate-Windows-x64-v0.6.0-20260811
          path: dist/KneeXrayMeasurement-ResearchCandidate-Windows-x64-v0.6.0-20260811.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
